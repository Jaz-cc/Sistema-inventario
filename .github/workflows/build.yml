
name: BUILD - Sistema de Inventario

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

jobs:
  build:
    name: Verificar JavaScript
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verificar archivo Producto.js
        run: |
          test -f Producto.js
          node --check Producto.js

      - name: Finalizar BUILD
        run: echo "El archivo Producto.js no presenta errores de sintaxis."
